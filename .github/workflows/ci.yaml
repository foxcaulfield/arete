name: CI

on:
    pull_request:
        branches: [main, develop]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install
              run: npm ci

            - name: Lint
              run: npm run lint:ci

            - name: Type-check (backend)
              run: npx tsc -p tsconfig.build.json --noEmit

            - name: Type-check (frontend — tsc)
              run: npx tsc -p front-end/tsconfig.app.json --noEmit

            - name: Type-check (frontend — svelte-check)
              run: npx svelte-check --tsconfig front-end/tsconfig.app.json

            - name: Test
              run: npm test -- --passWithNoTests

            - name: Build frontend
              run: npm run build:front

            - name: Build backend
              run: npx nest build

            - name: Verify Docker build
              run: docker build -t arete-ci-check .
              # This catches Dockerfile breakage on every PR instead of at release time
