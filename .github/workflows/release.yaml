jobs:
    release:
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.semantic.outputs.new_release_published }}
            version: ${{ steps.semantic.outputs.new_release_version }}
            channel: ${{ steps.semantic.outputs.new_release_channel }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }} 

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - run: npm ci

            - name: Semantic Release
              id: semantic
              env:
                  GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}   # ← changed from secrets.GITHUB_TOKEN
              run: npx semantic-release

    docker:
        # ... unchanged. Leave GITHUB_TOKEN in this job — GHCR login needs
        # packages:write from the default token, not the PAT.