name: Release

on:
    push:
        branches: [main, develop]

permissions:
    contents: write # create tags + releases + commit changelog
    packages: write # push to ghcr.io
    issues: write
    pull-requests: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false # never cancel a release mid-flight

jobs:
    release:
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.semantic.outputs.new_release_published }}
            version: ${{ steps.semantic.outputs.new_release_version }}
            channel: ${{ steps.semantic.outputs.new_release_channel }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - run: npm ci

            - name: Semantic Release
              id: semantic
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release

    docker:
        needs: release
        if: needs.release.outputs.published == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}
                  fetch-depth: 0

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=${{ needs.release.outputs.version }}
                      type=raw,value=${{ github.sha }}
                      type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                      type=raw,value=rc-latest,enable=${{ github.ref == 'refs/heads/develop' }}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
